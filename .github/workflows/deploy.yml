name: Deploy Laravel python App to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key_python.pem
        chmod 600 ~/.ssh/deploy_key_python.pem

    - name: Check SERVER_IP
      run: echo "Server IP is ${{ secrets.SERVER_IP }}"

    - name: Add known hosts
      run: |
        ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts_python

    - name: Deploy Code via SSH
      run: |
        ssh -i ~/.ssh/deploy_key_python.pem -T -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} bash << 'EOSSH'
          echo "Navigating to the backend directory and stashing changes"
          cd /var/www/pincap/pincap-python || { echo "Failed to cd into /var/www/pincap/pincap-python"; exit 1; }

          git stash || { echo "Git stash failed"; exit 1; }

          echo "Pulling the latest code from the master branch"
          git pull origin main || { echo "Git pull failed"; exit 1; }

          docker compose up --build

          echo "Deployment completed successfully"
        EOSSH
