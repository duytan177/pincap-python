version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pincap-app
    command: uvicorn App.Main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DB: ${MYSQL_DB:-pincap}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret_redis}
      REDIS_DB: ${REDIS_DB:-0}
      IP_SERVICE: ${IP_SERVICE:-127.0.0.1}
      KAFKA_PORT: ${KAFKA_PORT:-9092}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pincap-worker
    command: python App/Workers/worker.py
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DB: ${MYSQL_DB:-pincap}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret_redis}
      REDIS_DB: ${REDIS_DB:-0}
      IP_SERVICE: ${IP_SERVICE:-127.0.0.1}
      KAFKA_PORT: ${KAFKA_PORT:-9092}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    restart: unless-stopped
